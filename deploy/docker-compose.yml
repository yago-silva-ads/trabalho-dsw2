services:
  mysql:
    image: mysql:8.4
    container_name: waldo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-waldo_contabilidade}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - waldo-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    container_name: waldo-backend
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/waldo_contabilidade?useSSL=false&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BOOTSTRAP_SECRET: ${APP_BOOTSTRAP_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ../frontend
    container_name: waldo-frontend
    environment:
      API_URL: ${API_URL}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend

volumes:
  waldo-data:

